{{- if .Values.image.pullSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dextinity-admin.fullname" . }}-image-pull-secret
  labels:
    {{- include "dextinity-admin.labels" . | nindent 8 }}
data:
  .dockerconfigjson: {{ required "Missing image.pullSecret" .Values.image.pullSecret }}
type: kubernetes.io/dockerconfigjson
{{- end }}
